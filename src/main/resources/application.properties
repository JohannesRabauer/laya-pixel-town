server.port=8765
spring.mvc.async.request-timeout=-1
# Default Laya address shown on the start screen
pixeltown.laya.default-url=http://localhost:8002
# How the app talks to Laya: native (JDK HttpClient, one real batch call), langchain4j or spring-ai
# (both send one request per person, because neither library has a batch call)
pixeltown.laya.client=native
